services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cashcast}
      MYSQL_USER: ${MYSQL_USER:-cashcast}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run "python make_env.py" or set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run "python make_env.py" or set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "127.0.0.1:3307:3306"   # lets the launcher scripts use this MySQL when the API runs outside Docker
    volumes:
      - cashcast_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cashcast}
      MYSQL_USER: ${MYSQL_USER:-cashcast}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run "python make_env.py" or set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Run "python make_env.py" or set JWT_SECRET in .env}
      CASHCAST_DEMO_PASSWORD: ${CASHCAST_DEMO_PASSWORD:-demo123}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"

volumes:
  cashcast_mysql:
